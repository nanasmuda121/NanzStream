name: Build NanzStream Universal Release APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew || true

      - name: Build Universal Release APK
        run: |
          ./gradlew assembleRelease --stacktrace || gradle assembleRelease --stacktrace

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p build-output
          TAG_NAME="${{ github.ref_name }}"
          if [[ -z "$TAG_NAME" || "$TAG_NAME" == "main" || "$TAG_NAME" == "master" ]]; then
            TAG_NAME="v1.3.6"
          fi
          cp app/build/outputs/apk/release/app-release.apk "build-output/NanzStream-${TAG_NAME}-universal-release.apk"
          ls -lh build-output/

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NanzStream-universal-release
          path: build-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NanzStream Release ${{ github.ref_name }}
          files: build-output/*.apk
          draft: false
          prerelease: false
